
<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MULTIPLIQUEM NOMBRES DECIMALS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 1150px;
    margin: auto;
    background: white;
    padding: 25px;
    border: 2px solid black;
}

h1 {
    text-align: center;
    font-size: 30px;
    margin-bottom: 10px;
}

.instruccions {
    text-align: center;
    font-size: 20px;
    margin-bottom: 25px;
    line-height: 1.5;
}

/* COLORS DE RETOLADOR */

.blau {
    background: linear-gradient(
        transparent 30%,
        rgba(70, 160, 255, 0.55) 30%,
        rgba(70, 160, 255, 0.55) 90%,
        transparent 90%
    );
    padding: 2px 4px;
    border-radius: 3px;
}

.groc {
    background: linear-gradient(
        transparent 30%,
        rgba(255, 225, 50, 0.75) 30%,
        rgba(255, 225, 50, 0.75) 90%,
        transparent 90%
    );
    padding: 2px 4px;
    border-radius: 3px;
}

.taronja {
    background: linear-gradient(
        transparent 30%,
        rgba(255, 155, 55, 0.65) 30%,
        rgba(255, 155, 55, 0.65) 90%,
        transparent 90%
    );
    padding: 2px 4px;
    border-radius: 3px;
}

.llegenda {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin: 20px 0;
    font-size: 17px;
}

.llegenda span {
    padding: 5px 9px;
    font-weight: bold;
}

.exercici {
    border: 2px solid #222;
    padding: 16px;
    margin-bottom: 18px;
    background: white;
}

.fila-exercici {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}

.enunciat {
    font-size: 27px;
    font-weight: bold;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 5px;
}

/* CASELLES DE RESPOSTA */

.resultat {
    display: flex;
    align-items: center;
    gap: 0;
}

.resultat input {
    height: 52px;
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    border: 3px solid black;
    outline: none;
    border-radius: 0;
    padding: 2px;
}

.resultat input.blau-input {
    width: 75px;
    background: rgba(70, 160, 255, 0.22);
    border-color: #2585d8;
}

.resultat input.taronja-input {
    width: 38px;
    background: rgba(255, 155, 55, 0.25);
    border-color: #e58b2a;
    border-left: 1px solid #777;
    border-right: 1px solid #777;
}

.resultat input.groc-input {
    width: 65px;
    background: rgba(255, 225, 50, 0.30);
    border-color: #d5b500;
}

.resultat-final {
    font-size: 28px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 0;
    white-space: nowrap;
}

.resultat-final span {
    padding: 2px 4px;
}

button {
    font-size: 16px;
    font-weight: bold;
    padding: 11px 15px;
    border: 2px solid black;
    cursor: pointer;
    background: white;
}

button:hover {
    background: #eaeaea;
}

.correcte {
    background: #c8f2c8;
    border: 3px solid green;
}

.incorrecte {
    background: #ffd1d1;
    border: 3px solid red;
}

.missatge {
    font-size: 18px;
    font-weight: bold;
    margin-top: 10px;
    min-height: 22px;
}

#resum {
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    margin: 30px 0;
}

.pdf {
    display: block;
    margin: 25px auto 0;
    background: #222;
    color: white;
    padding: 16px 25px;
    font-size: 20px;
}

.pdf:hover {
    background: #444;
}

@media (max-width: 700px) {
    .container {
        padding: 12px;
    }

    .fila-exercici {
        gap: 10px;
    }

    .enunciat {
        font-size: 23px;
    }

    .resultat input {
        height: 46px;
        font-size: 21px;
    }

    .resultat input.blau-input {
        width: 60px;
    }

    .resultat input.taronja-input {
        width: 32px;
    }

    .resultat input.groc-input {
        width: 50px;
    }

    .resultat-final {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>MULTIPLIQUEM NOMBRES DECIMALS</h1>

<div class="instruccions">
    OBSERVA ELS NOMBRES I COMPLETA EL RESULTAT.<br>
    ESCRIU LES XIFRES A LES CASELLES BLAVES,<br>
    LA COMA A LA CASELLA TARONJA I ELS ZEROS A LA GROGA.
</div>

<div class="llegenda">
    <span class="blau">XIFRES DEL NOMBRE</span>
    <span class="taronja">COMA DECIMAL</span>
    <span class="groc">ZEROS QUE AFEGIM</span>
</div>

<div id="exercicis"></div>

<div id="resum"></div>

<button class="pdf" onclick="descarregarPDF()">
    DESCARREGAR RESULTATS EN PDF
</button>

</div>

<script>

// LES 10 MULTIPLICACIONS

// "abans" = xifres abans de la coma
// "despres" = xifres després de la coma
// "zeros" = zeros que cal afegir al final
// "coma" = si cal escriure la coma decimal

const dades = [
    {
        a: "2,35",
        b: 10,
        abans: "23",
        coma: ",",
        despres: "5",
        zeros: ""
    },
    {
        a: "4,26",
        b: 100,
        abans: "426",
        coma: "",
        despres: "",
        zeros: ""
    },
    {
        a: "1,2",
        b: 100,
        abans: "12",
        coma: "",
        despres: "",
        zeros: "0"
    },
    {
        a: "3,45",
        b: 10,
        abans: "34",
        coma: ",",
        despres: "5",
        zeros: ""
    },
    {
        a: "1,75",
        b: 100,
        abans: "175",
        coma: "",
        despres: "",
        zeros: ""
    },
    {
        a: "6,25",
        b: 1000,
        abans: "625",
        coma: "",
        despres: "",
        zeros: "0"
    },
    {
        a: "8,4",
        b: 10,
        abans: "84",
        coma: "",
        despres: "",
        zeros: ""
    },
    {
        a: "1,08",
        b: 10,
        abans: "10",
        coma: ",",
        despres: "8",
        zeros: ""
    },
    {
        a: "2,5",
        b: 1000,
        abans: "25",
        coma: "",
        despres: "",
        zeros: "00"
    },
    {
        a: "7,125",
        b: 10,
        abans: "71",
        coma: ",",
        despres: "25",
        zeros: ""
    }
];

const resultats = [];

function crearExercicis() {

    const contenidor = document.getElementById("exercicis");

    dades.forEach((d, i) => {

        resultats[i] = {
            resposta: "",
            estat: "PENDENT"
        };

        const zeros = d.b.toString().length - 1;

        const exercici = document.createElement("div");
        exercici.className = "exercici";
        exercici.id = "ex" + i;

        exercici.innerHTML = `
            <div class="fila-exercici">

                <div class="enunciat">
                    ${i + 1}.
                    <span class="blau">${d.a.split(",")[0]}</span><span class="taronja">,</span><span class="blau">${d.a.split(",")[1]}</span>
                    ×
                    <span>${d.b.toString().slice(0, 1)}<span class="groc">${"0".repeat(zeros)}</span></span>
                    =
                </div>

                <div class="resultat" id="zona_${i}">

                    <input
                        type="text"
                        inputmode="numeric"
                        maxlength="6"
                        id="r1_${i}"
                        class="blau-input"
                        aria-label="Xifres abans de la coma"
                    >

                    <input
                        type="text"
                        maxlength="1"
                        id="coma_${i}"
                        class="taronja-input"
                        placeholder=","
                        aria-label="Coma decimal"
                    >

                    <input
                        type="text"
                        inputmode="numeric"
                        maxlength="6"
                        id="r2_${i}"
                        class="blau-input"
                        aria-label="Xifres després de la coma"
                    >

                    <input
                        type="text"
                        inputmode="numeric"
                        maxlength="6"
                        id="r3_${i}"
                        class="groc-input"
                        aria-label="Zeros que afegim"
                    >

                </div>

                <button id="boto_${i}" onclick="corregir(${i})">
                    CORREGIR
                </button>

                <button onclick="reiniciar(${i})">
                    TORNAR A COMENÇAR
                </button>

            </div>

            <div class="missatge" id="m${i}"></div>
        `;

        contenidor.appendChild(exercici);
    });

    actualitzarResum();
}

function corregir(i) {

    const resposta1 = document.getElementById("r1_" + i).value.trim();
    const respostaComa = document.getElementById("coma_" + i).value.trim();
    const resposta2 = document.getElementById("r2_" + i).value.trim();
    const resposta3 = document.getElementById("r3_" + i).value.trim();

    const d = dades[i];

    const missatge = document.getElementById("m" + i);
    const exercici = document.getElementById("ex" + i);

    resultats[i].resposta =
        resposta1 + respostaComa + resposta2 + resposta3;

    if (
        resposta1 === d.abans &&
        respostaComa === d.coma &&
        resposta2 === d.despres &&
        resposta3 === d.zeros
    ) {

        resultats[i].estat = "CORRECTE";

        missatge.textContent = "MOLT BÉ! RESULTAT CORRECTE!";
        missatge.style.color = "green";

        exercici.classList.add("correcte");
        exercici.classList.remove("incorrecte");

        // MOSTREM EL RESULTAT CORRECTE AMB ELS COLORS

        const zona = document.getElementById("zona_" + i);

        zona.innerHTML = `
            <div class="resultat-final">
                <span class="blau">${d.abans}</span>${d.coma ? `<span class="taronja">${d.coma}</span>` : ""}${d.despres ? `<span class="blau">${d.despres}</span>` : ""}${d.zeros ? `<span class="groc">${d.zeros}</span>` : ""}
            </div>
        `;

        document.getElementById("boto_" + i).style.display = "none";

    } else {

        resultats[i].estat = "INCORRECTE";

        missatge.textContent = "TORNA-HO A PROVAR!";
        missatge.style.color = "red";

        exercici.classList.add("incorrecte");
        exercici.classList.remove("correcte");
    }

    actualitzarResum();
}

function reiniciar(i) {

    const zona = document.getElementById("zona_" + i);

    zona.innerHTML = `
        <input
            type="text"
            inputmode="numeric"
            maxlength="6"
            id="r1_${i}"
            class="blau-input"
            aria-label="Xifres abans de la coma"
        >

        <input
            type="text"
            maxlength="1"
            id="coma_${i}"
            class="taronja-input"
            placeholder=","
            aria-label="Coma decimal"
        >

        <input
            type="text"
            inputmode="numeric"
            maxlength="6"
            id="r2_${i}"
            class="blau-input"
            aria-label="Xifres després de la coma"
        >

        <input
            type="text"
            inputmode="numeric"
            maxlength="6"
            id="r3_${i}"
            class="groc-input"
            aria-label="Zeros que afegim"
        >
    `;

    document.getElementById("boto_" + i).style.display = "inline-block";

    document.getElementById("m" + i).textContent = "";

    const exercici = document.getElementById("ex" + i);
    exercici.classList.remove("correcte", "incorrecte");

    resultats[i].resposta = "";
    resultats[i].estat = "PENDENT";

    actualitzarResum();
}

function actualitzarResum() {

    const correctes = resultats.filter(
        r => r.estat === "CORRECTE"
    ).length;

    document.getElementById("resum").textContent =
        "EXERCICIS CORRECTES: " + correctes + " / " + dades.length;
}

function descarregarPDF() {

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.text("RESULTATS: MULTIPLICACIONS DECIMALS", 15, 20);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(11);

    let y = 32;

    const correctes = resultats.filter(
        r => r.estat === "CORRECTE"
    ).length;

    const incorrectes = resultats.filter(
        r => r.estat === "INCORRECTE"
    ).length;

    const pendents = resultats.filter(
        r => r.estat === "PENDENT"
    ).length;

    doc.text("Exercicis correctes: " + correctes, 15, y);
    y += 7;

    doc.text("Exercicis incorrectes: " + incorrectes, 15, y);
    y += 7;

    doc.text("Exercicis pendents: " + pendents, 15, y);
    y += 12;

    doc.setFont("helvetica", "bold");
    doc.text("DETALL DELS EXERCICIS", 15, y);
    y += 9;

    doc.setFont("helvetica", "normal");

    dades.forEach((d, i) => {

        if (y > 270) {
            doc.addPage();
            y = 20;
        }

        const r = resultats[i];

        const resposta = r.resposta || "(buit)";

        doc.text(
            (i + 1) + ". " + d.a + " x " + d.b +
            " = " + resposta +
            "  |  " + r.estat,
            15,
            y
        );

        y += 9;
    });

    doc.save("resultats_multiplicacions_decimals.pdf");
}

crearExercicis();

</script>

</body>
</html>
